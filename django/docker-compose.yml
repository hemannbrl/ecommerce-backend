# Brings up the Django API and its own PostgreSQL, with the shared schema and
# seed loaded automatically on first start.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      # ../db holds the shared schema.sql + seed.sql; *.sql here runs on init,
      # in filename order (01 before 02).
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DEBUG: "false"
      SECRET_KEY: change-me-in-production-to-a-long-random-string
      JWT_SECRET: change-me-in-production-to-a-long-random-string
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ecommerce_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      ALLOWED_HOSTS: "*"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
