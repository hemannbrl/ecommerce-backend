spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ecommerce_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none          # schema is owned by ../db/schema.sql; map onto it
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-to-a-long-random-string}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:1440}

springdoc:
  swagger-ui:
    path: /docs
